name: Build AVscode APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
        build-cache-enabled: true
        cache-read-only: false
        
    - name: Setup Android SDK with NDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708
        packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;29.0.14206865'
      
    - name: Set NDK Environment
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> $GITHUB_ENV
        echo "NDK version installed:"
        cat $ANDROID_SDK_ROOT/ndk/29.0.14206865/source.properties | grep Pkg.Revision
        
    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew
      
    - name: Build with Gradle
      run: |
        cd android
        ./gradlew assembleDebug --build-cache --stacktrace
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: avscode-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 1
        if-no-files-found: error
