name: AVSCode CI & Signed Release Build

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: wrapper
        cache-disabled: false
        validate-wrappers: false

    - name: Setup Android SDK with NDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708
        packages: 'platform-tools platforms;android-36 build-tools;35.0.0 ndk;29.0.14206865 cmake;3.22.1'

    - name: Set NDK & Environment Variables
      run: |
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> $GITHUB_ENV
        echo "NDK installed revision:"
        cat "$ANDROID_SDK_ROOT/ndk/29.0.14206865/source.properties" | grep Pkg.Revision || true

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Setup Release Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Decoding release keystore from secrets..."
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
        else
          echo "Generating automatic release keystore..."
          keytool -genkeypair -v \
            -keystore android/release.keystore \
            -alias avscode \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass avscode123 \
            -keypass avscode123 \
            -dname "CN=AVSCode, OU=Mobile, O=AVSCode, L=San Francisco, S=CA, C=US"
        fi

    - name: Run Unit Tests
      run: |
        cd android
        ./gradlew test --no-configuration-cache --stacktrace

    - name: Build Signed Release APK
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'avscode123' }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'avscode' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'avscode123' }}
      run: |
        cd android
        ./gradlew assembleRelease --no-configuration-cache --stacktrace

    - name: Verify Signed APK
      run: |
        APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
        if [ ! -f "$APK_PATH" ]; then
          echo "Error: Signed release APK not found at $APK_PATH"
          ls -la android/app/build/outputs/apk/release/
          exit 1
        fi
        
        echo "=== Verifying APK Signature ==="
        $ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner verify --verbose "$APK_PATH"
        
        echo "=== APK File Details ==="
        ls -lh "$APK_PATH"
        sha256sum "$APK_PATH"

    - name: Upload Signed Release APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: avscode-signed-release-apk
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 7
        if-no-files-found: error

    - name: Publish GitHub Release (on tag or manual dispatch)
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      uses: softprops/action-gh-release@v2
      with:
        files: android/app/build/outputs/apk/release/app-release.apk
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Failure Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-failure-logs
        path: |
          android/app/build/reports/
          android/build/reports/
        retention-days: 3
